# JVM Gradle : heap 768 Mo + GC serie pour tenir dans ~700 Mo disponibles
# (le packaging 3 ABI avait explose en OutOfMemoryError avec -Xmx512m).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
kotlin.daemon.jvmargs=-Xmx384m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# AAPT2 : binaire natif x86_64 du Maven Google incompatible avec ce CPU ARM64
# (« Daemon startup failed »). Override vers l'AAPT2 Debian compilé pour aarch64 :
android.aapt2FromMavenOverride=/usr/bin/aapt2
android.enableJetifier=true
systemProp.org.gradle.offline=true
android.builder.sdkDownload=false
android.builder.sdkDownload.notify=false
